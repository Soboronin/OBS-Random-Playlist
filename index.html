<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ランダム再生リンク ジェネレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1d22;
    --panel: #24272e;
    --panel-border: #343841;
    --text: #ecedee;
    --text-dim: #9298a3;
    --text-dim2: #5e5e66;
    --text-dim3: #49494e;
    --accent: #F95581;
    --accent-soft: #181818;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
    display: flex;
    justify-content: center;
    padding: 64px 20px;
  }

  main {
    width: 100%;
    max-width: 480px;
  }

  .tally {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0 0 8px;
    display: flex;
    align-items: center;
  }

  .lede {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.7;
    margin: 0 0 28px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 24px;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 11px 12px;
    font-size: 14px;
    color: var(--text);
    font-family: inherit;
  }

  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 16px 0 20px;
    font-size: 14px;
    color: var(--text);
  }

  .checkbox-row input { accent-color: var(--accent); width: 16px; height: 16px; }

  button {
    width: 100%;
    background: var(--accent);
    color: #1b1200;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  button:hover { filter: brightness(1.06); }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  button.secondary {
    width: auto;
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-weight: 500;
    padding: 9px 16px;
  }

  #result {
    display: none;
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--panel-border);
  }

  #result p { font-size: 13px; color: var(--text-dim); margin: 0 0 10px; }

  #urlBox {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 11px 12px;
    font-size: 12.5px;
    color: var(--text);
    margin-bottom: 10px;
  }

  .copy-row { display: flex; align-items: center; gap: 12px; }

  .copied { font-size: 13px; color: var(--accent); opacity: 0; transition: opacity 0.2s ease; }
  .copied.show { opacity: 1; }

  .hint {
     color: var(--text-dim);
     font-size: 12.5px;
     line-height: 1.7;
     margin: 16px 0 0;
     padding-left: 20px;
  }

  .hint li {
      margin: 4px 0;
  }

  footer {
    margin-top: 32px;
    text-align: center;
    color: var(--text-dim3);
    font-size: 11px;
    line-height: 1.6;
  }

  footer p {
    margin: 3px 0;
  }

  footer a {
    color: inherit;
    text-decoration: none;
  }

  footer a:hover {
    color: var(--text-dim2);
  }
</style>
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SQ4Q495FTY"></script>

  window.dataLayer = window.dataLayer || [];

<body>
<main>
  <h1><span class="tally"></span>ランダム再生リンク ジェネレーター</h1>
  <p class="lede">YouTubeのプレイリストから、OBSでランダム再生できるリンクを作ります。</p>

  <div class="panel">
    <label for="playlistInput">プレイリストのURL</label>
    <input type="text" id="playlistInput" placeholder="https://www.youtube.com/playlist?list=PLxxxxxxxxxxxxxxxx">

    <div class="checkbox-row">
      <input type="checkbox" id="muteCheckbox" checked>
      <label for="muteCheckbox" style="margin:0;">ミュートで再生する</label>
    </div>

    <button onclick="generate()">リンクを作る</button>

    <div id="result">
      <p>このURLをOBSの「ブラウザ」ソースに貼り付けてください。</p>
      <input type="text" id="urlBox" readonly onclick="this.select()">
      <div class="copy-row">
        <button class="secondary" onclick="copyUrl()">コピー</button>
        <span class="copied" id="copiedMsg">コピーしました</span>
      </div>
    </div>
  </div>

  <ul class="hint">
   <li>OBSでは「ローカルファイル」ではなく通常のURLとして追加してください。</li>
    <li>推奨サイズは幅1920×高さ1080等の16:9比率です。</li>
    <li>動画の音声を流したい場合、ブラウザソースのプロパティで「OBSで音量を制御する」にチェックを入れてください。</li>
  </ul>

  <footer>
    <p>Created by そぼろ忍</p>
    <p><a href="https://x.com/soboronin" target="_blank" rel="noopener noreferrer">X: @soboronin</a></p>
  </footer>

</main>

<script>
  function extractId(input) {
    input = input.trim();
    const match = input.match(/[?&]list=([^&]+)/);
    if (match) return decodeURIComponent(match[1]);
    return input;
  }

  function currentDir() {
    const clean = window.location.href.split('?')[0].split('#')[0];
    return clean.substring(0, clean.lastIndexOf('/') + 1);
  }

  function generate() {
    const input = document.getElementById('playlistInput');
    const raw = input.value;
    if (!raw.trim()) {
      input.focus();
      return;
    }
    const id = extractId(raw);
    const muted = document.getElementById('muteCheckbox').checked;
    const url = currentDir() + 'player.html?list=' + encodeURIComponent(id) + '&mute=' + (muted ? '1' : '0');

    document.getElementById('urlBox').value = url;
    document.getElementById('result').style.display = 'block';
    document.getElementById('copiedMsg').classList.remove('show');
  }

  function copyUrl() {
    const box = document.getElementById('urlBox');
    const msg = document.getElementById('copiedMsg');

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(box.value).then(showCopied);
    } else {
      box.select();
      document.execCommand('copy');
      showCopied();
    }

    function showCopied() {
      msg.classList.add('show');
    }
  }
</script>
</body>
</html>
